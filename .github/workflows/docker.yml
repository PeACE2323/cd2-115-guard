name: Build and Push Docker Image

# 触发条件：
#   - 推送到 main/master
#   - 打 tag（v1.0.0 之类）
#   - PR 时只构建不推送，用于验证 Dockerfile 是否可用
#   - 手动触发
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名固定为 ghcr.io/<owner>/cd2-115-guard
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. 静态检查 + 单元测试（不依赖第三方库，跑得很快）
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 基础镜像保持一致（p115client 需要 >=3.12）
          python-version: "3.12"

      - name: 单元测试
        run: python tests/run_all.py

      - name: proto 静态检查
        run: python tools/check_proto.py app/proto/clouddrive.proto

      - name: 后端静态检查
        run: python -u tools/check_backend.py

      - name: 前端静态检查
        run: python tools/check_ui.py static/index.html

  # ---------------------------------------------------------------------------
  # 1.5 依赖可解析性检查（比等 Docker 构建快得多，且能看到 pip 的完整报错）
  # ---------------------------------------------------------------------------
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip 依赖解析（dry-run，不实际安装）
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --report /tmp/report.json -r requirements.txt
          echo "=== 依赖解析成功 ==="
          python - <<'PY'
          import json
          data = json.load(open('/tmp/report.json'))
          for p in sorted(data.get('install', []), key=lambda x: x['metadata']['name'].lower()):
              print(f"{p['metadata']['name']:35} {p['metadata']['version']}")
          PY

  # ---------------------------------------------------------------------------
  # 2. 构建镜像并推送到 GHCR
  # ---------------------------------------------------------------------------
  build:
    needs: [test, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 覆盖绝大多数 NAS / 服务器；
          # 需要 arm64（如树莓派）可取消下一行注释
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已发布 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
