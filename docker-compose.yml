services:
  cd2-115-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cd2-115-guard:latest
    container_name: cd2-115-guard
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      # CD2 的 gRPC 端口是 19799（Web UI 才是 19798），别填错。
      #
      # 三种常见部署，按实际情况选：
      #   1) CD2 在宿主机/NAS 套件上          -> host.docker.internal:19799
      #   2) CD2 是另一个容器且已映射 19799   -> host.docker.internal:19799（推荐）
      #                                         或 宿主机局域网IP:19799
      #   3) CD2 与本容器在同一 Docker 网络   -> <CD2容器名>:19799
      CD2_DEFAULT_HOST: host.docker.internal:19799
    volumes:
      - ./data:/app/data
    # Linux 上让 host.docker.internal 指向宿主机网关（Docker Desktop 自带，无需此项）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # 若 CD2 以 host 网络运行，取消下面的注释改用宿主网络
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：若尚未部署 CloudDrive2，可一并启动（仅 gRPC 与 Web 端口）
  clouddrive2:
    image: cloudnas/clouddrive2:latest
    container_name: clouddrive2
    restart: unless-stopped
    ports:
      - "19798:19798"   # Web UI / gRPC-Web
      - "19799:19799"   # gRPC (HTTP/2 h2c, 供 CD2-115-Guard 调用)
    volumes:
      - ./cd2-config:/Config
    privileged: true
    profiles: ["with-cd2"]   # 默认不启动：docker compose --profile with-cd2 up -d
